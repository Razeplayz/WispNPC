name: Build WispNPCs

on:
  push:
    paths:
      - 'WispNPCs/**'
      - '.github/workflows/build-wispnpcs.yml'
  pull_request:
    paths:
      - 'WispNPCs/**'
      - '.github/workflows/build-wispnpcs.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: WispNPCs/pom.xml

      - name: Build WispNPCs
        run: mvn --batch-mode -f WispNPCs/pom.xml clean package

      - name: Upload WispNPCs JAR
        uses: actions/upload-artifact@v4
        with:
          name: WispNPCs-jar
          path: WispNPCs/target/wispnpcs-1.0.0.jar
          if-no-files-found: error
